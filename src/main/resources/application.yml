spring:
  # DB 설정
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  # SMTP 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          kakao:      # 이게 registrationId
            client-id: ${kakao.client.id}
            client-secret: ${kakao.client.secret}
            redirect-uri: ${kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - account_email
            provider: kakao
          google:
            client-id: ${google.client.id}
            client-secret: ${google.client.secret}
            redirect-uri: ${google.redirect-uri}
            scope:
              - profile
              - email
          apple:
            client-id: ${apple.client.id}
            client-secret: DUMMY_SECRET_FOR_APPLE
            redirect-uri: ${apple.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            client-name: Apple
            provider: apple
        provider:
            kakao:
              authorization-uri: https://kauth.kakao.com/oauth/authorize
              token-uri: https://kauth.kakao.com/oauth/token
              user-info-uri: https://kapi.kakao.com/v2/user/me
              user-name-attribute: id
            apple:
              authorization-uri: https://appleid.apple.com/auth/authorize
              token-uri: https://appleid.apple.com/auth/token
              user-info-uri: https://appleid.apple.com/auth/userinfo
              user-name-attribute: sub
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}

# Apple 인증에만 필요한 커스텀 속성 분리
apple:
  team-id: ${apple.team-id}
  key-id: ${apple.key-id}
  key-path: ${apple.key-path}

# 로깅 설정
logging:
  level:
    com.ssak.ssak: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.web.cors: DEBUG
    org.springframework.security: DEBUG

# JWT 설정
jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

# DevTools 자동 재시작 설정
spring.devtools.restart.enabled: false

# S3 버킷 설정
cloud:
  aws:
    s3:
      bucket: ${aws.bucket-name}
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${aws.access-key}
      secret-key: ${aws.secret-key}
    stack:
      auto: false    # EC2에서 실행하지 않을 때 CloudFormation 관련 에러 방지

server:
  forward-headers-strategy: native