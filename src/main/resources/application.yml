spring:
  # DB 설정
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  # SMTP 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          kakao:      # 이게 registrationId
            client-id: ${kakao.client.id}
            client-secret: ${kakao.client.secret}
            redirect-uri: ${kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - account_email
            provider: kakao
          google:
            client-id: ${google.client.id}
            client-secret: ${google.client.secret}
            redirect-uri: ${google.redirect-uri}
            scope:
              - profile
              - email
          apple:
            client-id: ${apple.client.id}
            client-secret: ${apple.client.secret}
            redirect-uri: ${apple.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            client-name: Apple
            provider: apple
        provider:
            kakao:
              authorization-uri: https://kauth.kakao.com/oauth/authorize
              token-uri: https://kauth.kakao.com/oauth/token
              user-info-uri: https://kapi.kakao.com/v2/user/me
              user-name-attribute: id
            apple:
              authorization-uri: https://appleid.apple.com/auth/authorize
              token-uri: https://appleid.apple.com/auth/token
              user-info-uri: https://appleid.apple.com/auth/userinfo
              user-name-attribute: sub
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}

# 로깅 설정
logging:
  level:
    com.ssak.ssak: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# JWT 설정
jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

# DevTools 자동 재시작 설정
spring.devtools.restart.enabled: false

