name: deploy.yml
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v5

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker에 빌드
      - name: Build by Docker
        run: |
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/seederslab-server:latest --load .

      # 5. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Push into DockerHub
      - name: Push into DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/seederslab-server:latest

      # 7. ec2 내에서 도커 이미지 풀 및 실행
      - name: SSH into EC2 and deploy container with Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 컨테이너 중지 및 삭제
            docker stop seederslab-server || true
            docker rm seederslab-server || true
            
            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/seederslab-server:latest
            
            # 컨테이너 재시작
            docker run -d -p 8080:8080 \
            --name seederslab-server \
            --env-file ./.env \
            ${{ secrets.DOCKERHUB_USERNAME }}/seederslab-server:latest
            
            # 사용하지 않는 이미지 정리
            docker image prune -f --filter "until=168h"