name: Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anc95/ChatGPT-CodeReview@main
        env:
          # 1. 깃허브 권한
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 2. 제미나이 설정
          # 이 액션에서 Gemini를 쓰려면 엔드포인트를 구글 주소로 바꿔줘야 합니다.
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_ENDPOINT: https://generativelanguage.googleapis.com/v1beta/openai/
          MODEL: gemini-1.5-flash

          # 3. 공통 설정
          LANGUAGE: Korean
          PROMPT: "너는 시니어 백엔드 개발자야. Spring Boot와 Java 관점에서 코드의 잠재적인 버그나 N+1 문제, 가독성을 위주로 리뷰해줘."
          MAX_PATCH_LENGTH: 10000
          IGNORE_PATTERNS: "*.md, .gitignore, build/**" # 리뷰 안 해도 되는 파일들