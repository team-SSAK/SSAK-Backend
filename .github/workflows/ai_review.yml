name: ai_review.yml
on:
  pull_request:
    types: [opened, synchronize]  # PR이 열리거나 코드가 업데이트 될 때

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      comments: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: AI Code Review
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        with:
          model: "gemini-1.5-flash"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}

