name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}

          git diff origin/${{ github.base_ref }}...HEAD \
            -- . ':(exclude)package-lock.json' \
                 ':(exclude)pnpm-lock.yaml' \
                 ':(exclude)yarn.lock' \
                 ':(exclude)*.svg' \
                 ':(exclude)*.png' \
                 ':(exclude)*.jpg' \
                 ':(exclude)*.jpeg' \
                 ':(exclude)*.md' \
                 > diff.txt

          echo "==== DIFF SIZE ===="
          wc -c diff.txt

      - name: Call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT=$(cat <<'EOF'
          You are a senior software engineer reviewing a pull request.

          Review the git diff below.

          Focus on:
          - Bugs
          - Security issues
          - Performance problems
          - Bad practices
          - NestJS / TypeScript best practices

          Rules:
          - Be concise
          - Do not praise unnecessarily
          - Ignore formatting unless problematic
          - Respond in Korean
          - Use markdown
          - If there are no issues, say:
            "특별한 문제는 발견되지 않았습니다."

          GIT DIFF:
          EOF
          )

          DIFF_CONTENT=$(cat diff.txt)

          jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF_CONTENT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: ($prompt + "\n\n" + $diff)
                    }
                  ]
                }
              ]
            }' > request.json

          curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            > response.json

          cat response.json

      - name: Extract Review
        run: |
          REVIEW=$(jq -r '
            .candidates[0].content.parts[0].text
          ' response.json)

          if [ "$REVIEW" = "null" ] || [ -z "$REVIEW" ]; then
            REVIEW="AI 리뷰 생성에 실패했습니다."
          fi

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> $GITHUB_OUTPUT
        id: extract

      - name: Comment PR
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.extract.outputs.review }}
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.REVIEW
            })