name: ai_review.yml
on:
  pull_request:
    types: [opened, synchronize]  # PR이 열리거나 코드가 업데이트 될 때

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 이력을 가져와 Diff 분석을 원활하게 함

      - name: AI Code Review
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        with:
          model: gemini-2.0-flash-lite
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}

